name: Protocol and MCP checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.10.11'
          python-version: '3.11'
      - name: Check Python code
        run: |
          uv sync --locked
          uv run --locked ruff check mcp tests/python
      - name: Test protocol, HTTP, stdio, and bundled help without game files
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Verify standalone wheel help from a separate environment
        shell: pwsh
        run: |
          uv build --wheel
          uv venv .cache/package-test
          $packagePython = Join-Path $PWD '.cache/package-test/Scripts/python.exe'
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv pip install --python $packagePython $wheel
          $env:PSMCP_TEST_PYTHON = $packagePython
          uv run --locked pytest tests/python/test_stdio.py
